
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove image backgrounds free with an AI background remover. Download transparent PNG images.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:25px 15px;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
.container{
  max-width:760px;
  margin:25px auto;
  padding:25px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}
h1{text-align:center;font-size:27px;margin:5px 0 10px}
.intro{text-align:center;color:#666;line-height:1.6}
.upload{
  display:block;
  margin:25px auto 15px;
  padding:18px;
  width:100%;
  border:2px dashed #9aa5b1;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  background:#fafafa;
}
.upload input{max-width:100%;margin-top:12px}
button{
  border:0;
  border-radius:8px;
  padding:13px 20px;
  font-size:15px;
  cursor:pointer;
  margin:7px 4px;
  background:#176b55;
  color:white;
}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{text-align:center;margin:15px 0}
#status{
  text-align:center;
  color:#444;
  min-height:25px;
  line-height:1.5;
  margin:15px 0;
}
.preview{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}
.preview-box{
  min-width:0;
  text-align:center;
}
.preview-box h3{font-size:15px}
.preview-box img{
  display:block;
  width:100%;
  max-height:380px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:8px;
  background-color:#eee;
  background-image:
    linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
  text-align:center;
  margin-top:22px;
}
@media(max-width:550px){
  .container{padding:17px}
  .preview{grid-template-columns:1fr}
  h1{font-size:23px}
}
</style>
</head>

<body>
<div class="container">

<h1>Free AI Background Remover</h1>
<p class="intro">
Remove image backgrounds with AI and download transparent PNG images.
</p>

<label class="upload">
<strong>Select Your Image</strong><br>
<input type="file" id="fileInput" accept="image/*">
</label>

<div class="actions">
<button id="removeBtn" disabled>Remove Background</button>
<button id="downloadBtn" disabled>Download PNG</button>
</div>

<div id="status">Please select an image to get started.</div>

<div class="preview">
  <div class="preview-box">
    <h3>Original Image</h3>
    <img id="originalPreview" alt="Original image preview">
  </div>

  <div class="preview-box">
    <h3>Background Removed</h3>
    <img id="resultPreview" alt="Background removed preview">
  </div>
</div>

<p class="note">
Your image is processed in your browser. The first AI model download may take some time.
</p>

</div>

<script type="module">
import {
  AutoModel,
  AutoProcessor,
  RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const MODEL_ID = "vlad-grig/birefnet-lite-512";

const fileInput = document.getElementById("fileInput");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const originalPreview = document.getElementById("originalPreview");
const resultPreview = document.getElementById("resultPreview");

let selectedFile = null;
let originalImage = null;
let resultUrl = null;
let model = null;
let processor = null;
let modelLoading = null;

function setStatus(message){
  statusBox.textContent = message;
}

function loadAI(){
  if(model && processor){
    return Promise.resolve();
  }

  if(modelLoading){
    return modelLoading;
  }

  modelLoading = (async()=>{
    setStatus("Loading AI model... Please wait. First download can take time.");

    model = await AutoModel.from_pretrained(MODEL_ID,{
      dtype:"fp32",
      device:"wasm"
    });

    processor = await AutoProcessor.from_pretrained(MODEL_ID);

    setStatus("AI model is ready.");
  })();

  try{
    return await modelLoading;
  }catch(error){
    model = null;
    processor = null;
    modelLoading = null;
    throw error;
  }
}

fileInput.addEventListener("change",()=>{
  const file = fileInput.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    setStatus("Please select a valid image.");
    return;
  }

  selectedFile = file;

  if(originalImage){
    URL.revokeObjectURL(originalImage);
  }

  originalImage = URL.createObjectURL(file);
  originalPreview.src = originalImage;

  resultPreview.removeAttribute("src");

  if(resultUrl){
    URL.revokeObjectURL(resultUrl);
    resultUrl = null;
  }

  removeBtn.disabled = false;
  downloadBtn.disabled = true;

  setStatus("Image selected. Click Remove Background.");
});

removeBtn.addEventListener("click",async()=>{
  if(!selectedFile) return;

  removeBtn.disabled = true;
  downloadBtn.disabled = true;

  try{
    setStatus("Preparing AI model...");

    await loadAI();

    setStatus("Reading your image...");

    const image = await RawImage.read(originalImage);
    const {pixel_values} = await processor(image);

    setStatus("AI is detecting the subject. Please wait...");

    const {logits} = await model({
      input_image:pixel_values
    });

    if(!logits || !logits.dims || !logits.data){
      throw new Error("AI did not return a valid mask.");
    }

    const dims = logits.dims;
    const maskHeight = dims[dims.length-2];
    const maskWidth = dims[dims.length-1];
    const maskData = logits.data;

    if(
      !maskWidth ||
      !maskHeight ||
      maskData.length < maskWidth*maskHeight
    ){
      throw new Error("AI mask data is incomplete.");
    }

    setStatus("Refining image edges...");

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = maskWidth;
    maskCanvas.height = maskHeight;

    const maskCtx = maskCanvas.getContext("2d");
    const maskImageData = maskCtx.createImageData(
      maskWidth,
      maskHeight
    );

    for(let i=0;i<maskWidth*maskHeight;i++){
      const probability = 1/(1+Math.exp(-maskData[i]));
      const alpha = Math.round(
        Math.max(0,Math.min(1,probability))*255
      );

      const p = i*4;
      maskImageData.data[p] = 255;
      maskImageData.data[p+1] = 255;
      maskImageData.data[p+2] = 255;
      maskImageData.data[p+3] = alpha;
    }

    maskCtx.putImageData(maskImageData,0,0);

    const bitmap = await createImageBitmap(selectedFile);

    const outputCanvas = document.createElement("canvas");
    outputCanvas.width = bitmap.width;
    outputCanvas.height = bitmap.height;

    const outputCtx = outputCanvas.getContext("2d",{
      willReadFrequently:true
    });

    outputCtx.drawImage(
      bitmap,
      0,0,
      outputCanvas.width,
      outputCanvas.height
    );

    const fullMaskCanvas = document.createElement("canvas");
    fullMaskCanvas.width = bitmap.width;
    fullMaskCanvas.height = bitmap.height;

    const fullMaskCtx = fullMaskCanvas.getContext("2d");

    fullMaskCtx.imageSmoothingEnabled = true;
    fullMaskCtx.imageSmoothingQuality = "high";

    fullMaskCtx.drawImage(
      maskCanvas,
      0,0,
      bitmap.width,
      bitmap.height
    );

    const fullMask = fullMaskCtx.getImageData(
      0,0,
      bitmap.width,
      bitmap.height
    );

    const output = outputCtx.getImageData(
      0,0,
      bitmap.width,
      bitmap.height
    );

    for(let i=0;i<output.data.length;i+=4){
      output.data[i+3] = fullMask.data[i+3];
    }

    outputCtx.putImageData(output,0,0);

    bitmap.close();

    const blob = await new Promise(resolve=>{
      outputCanvas.toBlob(resolve,"image/png");
    });

    if(!blob){
      throw new Error("PNG could not be created.");
    }

    if(resultUrl){
      URL.revokeObjectURL(resultUrl);
    }

    resultUrl = URL.createObjectURL(blob);
    resultPreview.src = resultUrl;

    downloadBtn.disabled = false;
    setStatus("Background removed. You can download your PNG.");

  }catch(error){
    console.error(error);
    setStatus("Error: " + (error.message || "Something went wrong."));
  }finally{
    removeBtn.disabled = false;
  }
});

downloadBtn.addEventListener("click",()=>{
  if(!resultUrl) return;

  const link = document.createElement("a");
  link.href = resultUrl;
  link.download = "world-watcher-background-removed.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
});
</script>
</body>
</html>
