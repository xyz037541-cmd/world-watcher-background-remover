
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove image backgrounds for free with our AI background remover. Download transparent PNG images.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:25px 15px;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#222;
}
.container{
  max-width:760px;
  margin:30px auto;
  padding:28px;
  background:white;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.07);
}
h1{text-align:center;color:#176b55}
.intro{text-align:center;color:#666;line-height:1.6}
.upload-box{
  margin:25px 0;
  padding:30px 15px;
  border:2px dashed #299879;
  border-radius:12px;
  text-align:center;
  background:#f8fffc;
}
input[type=file]{max-width:100%;margin-top:12px}
button{
  border:0;
  border-radius:7px;
  padding:13px 22px;
  background:#168365;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin:8px 4px;
}
button:disabled{opacity:.5;cursor:not-allowed}
#downloadBtn{background:#245fc1}
#status{
  margin:18px 0;
  text-align:center;
  line-height:1.6;
  color:#176b55;
  font-size:14px;
  overflow-wrap:anywhere;
}
.preview{
  display:none;
  margin-top:25px;
  text-align:center;
}
.preview img{
  max-width:100%;
  max-height:480px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:8px;
  background-color:white;
  background-image:
    linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
.note{
  margin-top:20px;
  color:#777;
  font-size:13px;
  line-height:1.6;
  text-align:center;
}
</style>
</head>

<body>
<div class="container">

<h1>Free AI Background Remover</h1>

<p class="intro">
Remove the background from your photos in your browser.
Upload an image and download it as a transparent PNG.
</p>

<div class="upload-box">
<strong>Select Your Image</strong><br>
<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
</div>

<div style="text-align:center">
<button id="removeBtn" disabled>Remove Background</button>
<button id="downloadBtn" disabled>Download PNG</button>
</div>

<div id="status">Please select an image to begin.</div>

<div class="preview" id="preview">
<h3>Result Preview</h3>
<img id="resultImage" alt="Background removed image">
</div>

<p class="note">
Your image is processed in your browser. The AI model may take time
to load the first time.
</p>

</div>

<script type="module">
import {
  AutoModel,
  AutoProcessor,
  RawImage
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

const fileInput = document.getElementById("fileInput");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");
const resultImage = document.getElementById("resultImage");

let selectedFile = null;
let resultUrl = null;
let model = null;
let processor = null;

function status(message){
  statusBox.textContent = message;
}

fileInput.addEventListener("change",()=>{
  selectedFile = fileInput.files[0] || null;
  removeBtn.disabled = !selectedFile;
  downloadBtn.disabled = true;
  preview.style.display = "none";

  if(resultUrl){
    URL.revokeObjectURL(resultUrl);
    resultUrl = null;
  }

  status(selectedFile
    ? "Image selected. Click Remove Background."
    : "Please select an image.");
});

async function loadAI(){
  if(model && processor) return;

  status("Loading AI model. Please wait...");

  const modelName = "vlad-grig/birefnet-lite-512";

  model = await AutoModel.from_pretrained(modelName,{
    dtype:"fp32",
    device:"wasm"
  });

  processor = await AutoProcessor.from_pretrained(modelName);
}

removeBtn.addEventListener("click",async()=>{
  if(!selectedFile) return;

  removeBtn.disabled = true;
  downloadBtn.disabled = true;

  let imageUrl = null;

  try{
    await loadAI();

    status("Preparing your photo...");

    imageUrl = URL.createObjectURL(selectedFile);

    const original = await RawImage.read(imageUrl);
    const {pixel_values} = await processor(original);

    status("AI is detecting the subject. Please wait...");

    const {logits} = await model({
      input_image:pixel_values
    });

    if(!logits || !logits.data || !logits.dims){
      throw new Error("AI mask was not generated correctly.");
    }

    const dims = logits.dims;
    const maskHeight = dims[dims.length-2];
    const maskWidth = dims[dims.length-1];
    const values = logits.data;

    if(!maskWidth || !maskHeight ||
       values.length < maskWidth*maskHeight){
      throw new Error("AI returned an invalid mask.");
    }

    const lowCanvas = document.createElement("canvas");
    lowCanvas.width = maskWidth;
    lowCanvas.height = maskHeight;

    const lowCtx = lowCanvas.getContext("2d");
    const maskImage = lowCtx.createImageData(maskWidth,maskHeight);

    for(let i=0;i<maskWidth*maskHeight;i++){
      const probability = 1/(1+Math.exp(-values[i]));
      const shade = Math.round(probability*255);

      const p = i*4;
      maskImage.data[p] = shade;
      maskImage.data[p+1] = shade;
      maskImage.data[p+2] = shade;
      maskImage.data[p+3] = 255;
    }

    lowCtx.putImageData(maskImage,0,0);

    status("Applying transparent background...");

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = original.width;
    maskCanvas.height = original.height;

    const maskCtx = maskCanvas.getContext("2d",{
      willReadFrequently:true
    });

    maskCtx.imageSmoothingEnabled = true;
    maskCtx.imageSmoothingQuality = "high";
    maskCtx.drawImage(
      lowCanvas,
      0,0,original.width,original.height
    );

    const fullMask = maskCtx.getImageData(
      0,0,original.width,original.height
    );

    const photo = new Image();

    await new Promise((resolve,reject)=>{
      photo.onload = resolve;
      photo.onerror = ()=>reject(
        new Error("Could not open your photo.")
      );
      photo.src = imageUrl;
    });

    const canvas = document.createElement("canvas");
    canvas.width = original.width;
    canvas.height = original.height;

    const ctx = canvas.getContext("2d",{
      willReadFrequently:true
    });

    ctx.drawImage(photo,0,0,canvas.width,canvas.height);

    const finalImage = ctx.getImageData(
      0,0,canvas.width,canvas.height
    );

    const pixels = finalImage.data;

    for(let i=0;i<canvas.width*canvas.height;i++){
      pixels[i*4+3] = fullMask.data[i*4];
    }

    ctx.putImageData(finalImage,0,0);

    const blob = await new Promise(resolve=>{
      canvas.toBlob(resolve,"image/png");
    });

    if(!blob){
      throw new Error("Could not create PNG file.");
    }

    if(resultUrl) URL.revokeObjectURL(resultUrl);

    resultUrl = URL.createObjectURL(blob);
    resultImage.src = resultUrl;

    preview.style.display = "block";
    downloadBtn.disabled = false;

    status("Background removed! Check your image and download it.");

  }catch(error){
    console.error(error);
    status("Sorry, something went wrong: "+(
      error.message || "Please try again."
    ));
  }finally{
    if(imageUrl) URL.revokeObjectURL(imageUrl);
    removeBtn.disabled = !selectedFile;
  }
});

downloadBtn.addEventListener("click",()=>{
  if(!resultUrl) return;

  const link = document.createElement("a");
  link.href = resultUrl;
  link.download = "world-watcher-background-removed.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
});
</script>

</body>
</html>
