
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove image backgrounds free with AI and download transparent PNG images.">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  background: #f1f6fc;
  color: #263445;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 25px;
  background: #ffffff;
  border: 1px solid #dce7f3;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(7,55,99,0.08);
}

h1 {
  text-align: center;
  color: #073763;
  font-size: 28px;
  margin: 5px 0 12px;
}

.intro {
  text-align: center;
  color: #64748b;
  line-height: 1.7;
  margin-bottom: 25px;
}

.upload-area {
  margin: 25px 0;
  padding: 30px 15px;
  text-align: center;
  border: 2px dashed #8bb5d9;
  border-radius: 12px;
  background: #f5f9fe;
}

.upload-area strong {
  color: #073763;
  font-size: 17px;
}

#fileInput {
  display: none;
}

button {
  padding: 13px 22px;
  margin: 6px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg,#073763,#176b9b);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover:not(:disabled) {
  background: #0b5287;
  transform: translateY(-1px);
}

button:disabled {
  background: #a9b9ca;
  cursor: not-allowed;
}

.buttons {
  text-align: center;
}

#fileName {
  color: #64748b;
  font-size: 14px;
  overflow-wrap: anywhere;
}

#status {
  text-align: center;
  margin: 22px 0;
  padding: 13px;
  color: #073763;
  background: #edf5fc;
  border: 1px solid #d6e6f5;
  border-radius: 8px;
  font-weight: 600;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.preview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.preview-box {
  min-width: 0;
  padding: 14px;
  border: 1px solid #dce7f3;
  border-radius: 10px;
  background: #ffffff;
  text-align: center;
}

.preview-box h3 {
  color: #073763;
  font-size: 16px;
  margin: 5px 0 15px;
}

.preview-box img {
  display: block;
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  background-color: #e6f1fb;
  background-image:
    linear-gradient(45deg,#cbd9e8 25%,transparent 25%),
    linear-gradient(-45deg,#cbd9e8 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#cbd9e8 75%),
    linear-gradient(-45deg,transparent 75%,#cbd9e8 75%);
  background-size: 20px 20px;
  background-position: 0 0,0 10px,10px -10px,-10px 0;
}

@media(max-width:600px) {
  body {
    padding: 15px 10px;
  }

  .container {
    padding: 18px 13px;
  }

  h1 {
    font-size: 23px;
  }

  .preview {
    grid-template-columns: 1fr;
  }

  button {
    padding: 12px 17px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Free AI Background Remover</h1>

<p class="intro">
Remove image backgrounds with AI and download transparent PNG images.
</p>

<div class="upload-area">
  <strong>Select Your Image</strong>
  <br><br>
  <input type="file" id="fileInput" accept="image/*">
  <button type="button" id="chooseBtn">Choose Image</button>
  <p id="fileName">No image selected</p>
</div>

<div class="buttons">
  <button type="button" id="removeBtn" disabled>
    Remove Background
  </button>

  <button type="button" id="downloadBtn" disabled>
    Download PNG
  </button>
</div>

<div id="status">Please select an image to get started.</div>

<div class="preview">

  <div class="preview-box">
    <h3>Original Image</h3>
    <img id="originalPreview" alt="Original image preview">
  </div>

  <div class="preview-box">
    <h3>Background Removed</h3>
    <img id="resultPreview" alt="Background removed preview">
  </div>

</div>
</div>

<script type="module">

const fileInput = document.getElementById("fileInput");
const chooseBtn = document.getElementById("chooseBtn");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");

const statusText = document.getElementById("status");
const fileName = document.getElementById("fileName");

const originalPreview = document.getElementById("originalPreview");
const resultPreview = document.getElementById("resultPreview");

let selectedFile = null;
let originalURL = null;
let resultURL = null;
let segmenter = null;
let processing = false;

chooseBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {

  const file = fileInput.files?.[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "Please select a valid image.";
    return;
  }

  selectedFile = file;

  if (originalURL) URL.revokeObjectURL(originalURL);
  if (resultURL) URL.revokeObjectURL(resultURL);

  originalURL = URL.createObjectURL(file);
  resultURL = null;

  originalPreview.src = originalURL;
  resultPreview.removeAttribute("src");

  fileName.textContent = file.name;

  removeBtn.disabled = false;
  downloadBtn.disabled = true;

  statusText.textContent =
    "Image selected. Click Remove Background.";

});

async function prepareImage(file) {

  const image = new Image();
  const sourceURL = URL.createObjectURL(file);

  try {

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(
        new Error("Could not open your image.")
      );
      image.src = sourceURL;
    });

    const maxSize = 1200;

    const scale = Math.min(
      1,
      maxSize / Math.max(
        image.naturalWidth,
        image.naturalHeight
      )
    );

    const width = Math.round(image.naturalWidth * scale);
    const height = Math.round(image.naturalHeight * scale);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const context = canvas.getContext("2d");

    if (!context) {
      throw new Error("Could not prepare image.");
    }

    context.drawImage(image, 0, 0, width, height);

    const blob = await new Promise(resolve => {
      canvas.toBlob(resolve, "image/png");
    });

    if (!blob) {
      throw new Error("Image preparation failed.");
    }

    return URL.createObjectURL(blob);

  } finally {
    URL.revokeObjectURL(sourceURL);
  }
}

removeBtn.addEventListener("click", async () => {

  if (!selectedFile || processing) return;

  processing = true;

  removeBtn.disabled = true;
  chooseBtn.disabled = true;
  downloadBtn.disabled = true;

  let preparedURL = null;

  try {

    statusText.textContent = "Preparing your image...";

    preparedURL = await prepareImage(selectedFile);

    statusText.textContent =
      "Loading AI model. First use may take a few minutes...";

    if (!segmenter) {

      const { pipeline } = await import(
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
      );

      segmenter = await pipeline(
        "background-removal",
        "onnx-community/ormbg-ONNX",
        {
          device: "wasm"
        }
      );
    }

    statusText.textContent =
      "Removing background. Please wait...";

    const output = await segmenter([preparedURL]);

    if (!output || !output[0] ||
        typeof output[0].toBlob !== "function") {
      throw new Error("AI did not return a valid transparent image.");
    }

    const resultBlob = await output[0].toBlob();

    if (!resultBlob || resultBlob.size === 0) {
      throw new Error("Could not create the PNG image.");
    }

    if (resultURL) URL.revokeObjectURL(resultURL);

    resultURL = URL.createObjectURL(resultBlob);
    resultPreview.src = resultURL;

    downloadBtn.disabled = false;

    statusText.textContent =
      "Background removed successfully! Download your PNG.";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Error: " + (error.message || "Background removal failed.");

  } finally {

    if (preparedURL) URL.revokeObjectURL(preparedURL);

    processing = false;
    removeBtn.disabled = !selectedFile;
    chooseBtn.disabled = false;

  }

});

downloadBtn.addEventListener("click", () => {

  if (!resultURL) return;

  const link = document.createElement("a");
  link.href = resultURL;
  link.download = "background-removed.png";

  document.body.appendChild(link);
  link.click();
  link.remove();

});

</script>
</body>
</html>
