
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove photo backgrounds free with our browser-based AI background remover. Download transparent PNG images.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#25332f;
}
.container{
  max-width:850px;
  margin:35px auto;
  padding:25px;
}
.card{
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 4px 22px #0000000c;
  text-align:center;
}
h1{color:#187653;margin:0 0 10px}
.subtitle{color:#68756f;line-height:1.6}
.upload-area{
  display:block;
  border:2px dashed #8bbba5;
  background:#f7fbf8;
  padding:45px 15px;
  border-radius:14px;
  cursor:pointer;
  margin:25px 0;
}
.upload-area:hover{background:#edf7f0}
.upload-area input{display:none}
.upload-icon{font-size:42px}
.upload-area p{margin:10px 0;color:#456354}
button{
  border:0;
  border-radius:8px;
  padding:13px 22px;
  margin:7px;
  background:#187653;
  color:white;
  font-size:15px;
  cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#53645c}
#status{
  margin:18px 0;
  color:#187653;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.preview{
  display:none;
  margin:20px auto;
  max-width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background-color:#fff;
  background-image:
    linear-gradient(45deg,#ddd 25%,transparent 25%),
    linear-gradient(-45deg,#ddd 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ddd 75%),
    linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
.preview img{
  display:block;
  max-width:100%;
  height:auto;
  margin:auto;
}
.note{
  font-size:13px;
  color:#75817b;
  line-height:1.6;
  margin-top:22px;
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h1>World Watcher</h1>
<h2>Free AI Background Remover</h2>

<p class="subtitle">
Remove the background from your photos and download a transparent PNG.
</p>

<label class="upload-area" for="fileInput">
<input type="file" id="fileInput"
accept="image/jpeg,image/png,image/webp">
<div class="upload-icon">📷</div>
<p><strong>Upload Your Image</strong></p>
<p>Click here to choose a photo</p>
<small>JPG, PNG or WEBP — maximum 10 MB</small>
</label>

<button id="removeBtn" disabled>Remove Background</button>
<button id="downloadBtn" disabled>Download Transparent PNG</button>
<button id="resetBtn" class="secondary">Choose Another Image</button>

<div id="status">Choose an image to get started.</div>

<div class="preview" id="preview">
<img id="resultImage" alt="Background removed image preview">
</div>

<p class="note">
Free browser-based AI processing. The AI model downloads the first time you use the tool.
Processing speed depends on your device.
</p>

</div>
</div>

<script type="module">

import { pipeline, RawImage } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const fileInput = document.getElementById("fileInput");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");
const resultImage = document.getElementById("resultImage");

const modelName = "vlad-grig/birefnet-lite-512";

let segmenter = null;
let activeDevice = null;
let selectedFile = null;
let previewURL = null;
let resultURL = null;
let isProcessing = false;


// Upload image

fileInput.addEventListener("change", () => {

  const file = fileInput.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusBox.textContent = "Please choose a valid image.";
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    statusBox.textContent =
      "Please choose an image under 10 MB.";
    fileInput.value = "";
    return;
  }

  selectedFile = file;

  if (previewURL) URL.revokeObjectURL(previewURL);
  if (resultURL) URL.revokeObjectURL(resultURL);

  resultURL = null;
  previewURL = URL.createObjectURL(file);

  resultImage.src = previewURL;
  preview.style.display = "block";

  downloadBtn.disabled = true;
  removeBtn.disabled = false;

  statusBox.textContent = "Image selected: " + file.name;

});


// Load AI model

async function loadSegmenter() {

  if (segmenter) return;

  const options = {
    dtype: "fp32"
  };

  // Try WebGPU first

  if (navigator.gpu) {

    try {

      statusBox.textContent =
        "Loading AI model with WebGPU FP32...";

      segmenter = await pipeline(
        "image-segmentation",
        modelName,
        {
          ...options,
          device: "webgpu"
        }
      );

      activeDevice = "WebGPU";
      return;

    } catch (error) {

      console.warn("WebGPU failed. Trying CPU/WASM.", error);
      segmenter = null;

    }
  }

  // CPU/WASM fallback

  statusBox.textContent =
    "Loading AI model in CPU mode. This may take longer...";

  segmenter = await pipeline(
    "image-segmentation",
    modelName,
    {
      ...options,
      device: "wasm"
    }
  );

  activeDevice = "CPU";

}


// Remove background

removeBtn.addEventListener("click", async () => {

  if (!selectedFile || isProcessing) return;

  isProcessing = true;
  removeBtn.disabled = true;
  downloadBtn.disabled = true;
  fileInput.disabled = true;

  let originalURL = null;

  try {

    statusBox.textContent =
      "Loading AI model. First download may take some time...";

    await loadSegmenter();

    statusBox.textContent =
      "AI is analysing your image...";

    const image = await RawImage.read(selectedFile);

    const originalWidth = image.width;
    const originalHeight = image.height;

    const output = await segmenter(image);

    if (!output || !output.length || !output[0].mask) {
      throw new Error(
        "The AI did not return an image mask. Please try another image."
      );
    }

    const mask = output[0].mask;

    const maskWidth = mask.width;
    const maskHeight = mask.height;
    const maskValues = mask.data;

    if (!maskValues || !maskWidth || !maskHeight) {
      throw new Error("The AI returned an empty mask.");
    }

    statusBox.textContent =
      "Applying transparent background...";

    // Create resized alpha mask

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = maskWidth;
    maskCanvas.height = maskHeight;

    const maskContext = maskCanvas.getContext("2d");

    const maskImageData = maskContext.createImageData(
      maskWidth,
      maskHeight
    );

    const channels = maskValues.length /
      (maskWidth * maskHeight);

    for (let i = 0; i < maskWidth * maskHeight; i++) {

      let alpha = maskValues[Math.floor(i * channels)];

      // Keep the mask's original grayscale values

      alpha = Math.max(0, Math.min(255, alpha));

      const p = i * 4;

      maskImageData.data[p] = 255;
      maskImageData.data[p + 1] = 255;
      maskImageData.data[p + 2] = 255;
      maskImageData.data[p + 3] = alpha;

    }

    maskContext.putImageData(maskImageData, 0, 0);

    const finalMask = document.createElement("canvas");
    finalMask.width = originalWidth;
    finalMask.height = originalHeight;

    const finalMaskContext = finalMask.getContext("2d");

    finalMaskContext.imageSmoothingEnabled = true;
    finalMaskContext.imageSmoothingQuality = "high";

    finalMaskContext.drawImage(
      maskCanvas,
      0,
      0,
      originalWidth,
      originalHeight
    );


    // Load original image

    originalURL = URL.createObjectURL(selectedFile);

    const originalImage = new Image();

    await new Promise((resolve, reject) => {
      originalImage.onload = resolve;
      originalImage.onerror = reject;
      originalImage.src = originalURL;
    });


    // Preserve original RGB colours

    const finalCanvas = document.createElement("canvas");
    finalCanvas.width = originalWidth;
    finalCanvas.height = originalHeight;

    const finalContext = finalCanvas.getContext("2d", {
      willReadFrequently: true
    });

    finalContext.drawImage(
      originalImage,
      0,
      0,
      originalWidth,
      originalHeight
    );

    const imageData = finalContext.getImageData(
      0, 0, originalWidth, originalHeight
    );

    const maskData = finalMaskContext.getImageData(
      0, 0, originalWidth, originalHeight
    );

    // Change alpha only. Original colours stay untouched.

    for (let i = 0; i < imageData.data.length; i += 4) {

      imageData.data[i + 3] = Math.round(
        imageData.data[i + 3] *
        maskData.data[i + 3] / 255
      );

    }

    finalContext.putImageData(imageData, 0, 0);


    // Export transparent PNG

    const blob = await new Promise(resolve => {
      finalCanvas.toBlob(resolve, "image/png");
    });

    if (!blob) {
      throw new Error("Could not create PNG image.");
    }

    if (resultURL) URL.revokeObjectURL(resultURL);

    resultURL = URL.createObjectURL(blob);
    resultImage.src = resultURL;

    preview.style.display = "block";
    downloadBtn.disabled = false;

    statusBox.textContent =
      "Background removed successfully! (" +
      activeDevice + " mode)";

  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "Sorry, something went wrong: " +
      (error.message || "Please try again.");

    segmenter = null;
    activeDevice = null;

  } finally {

    if (originalURL) URL.revokeObjectURL(originalURL);

    isProcessing = false;
    fileInput.disabled = false;
    removeBtn.disabled = !selectedFile;

  }

});


// Download PNG

downloadBtn.addEventListener("click", () => {

  if (!resultURL) return;

  const link = document.createElement("a");
  link.href = resultURL;
  link.download = "world-watcher-background-removed.png";

  document.body.appendChild(link);
  link.click();
  link.remove();

});


// Reset

resetBtn.addEventListener("click", () => {

  if (isProcessing) return;

  selectedFile = null;
  fileInput.value = "";

  removeBtn.disabled = true;
  downloadBtn.disabled = true;

  preview.style.display = "none";
  resultImage.removeAttribute("src");

  statusBox.textContent =
    "Choose an image to get started.";

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  if (resultURL) {
    URL.revokeObjectURL(resultURL);
    resultURL = null;
  }

});

</script>
</body>
</html>
