
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove image backgrounds free with our browser-based AI background remover. Download transparent PNG images.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:25px 15px;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
}
.container{
  max-width:850px;
  margin:auto;
  padding:25px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}
h1{text-align:center;color:#23734d}
.intro{text-align:center;color:#666;line-height:1.6}
.upload-area{
  margin:25px 0;
  padding:25px 15px;
  text-align:center;
  border:2px dashed #70a88b;
  border-radius:10px;
  background:#f8fcf9;
}
#fileInput{display:none}
button{
  padding:13px 22px;
  margin:6px;
  border:0;
  border-radius:7px;
  background:#287b50;
  color:white;
  font-size:15px;
  cursor:pointer;
}
button:disabled{
  background:#aaa;
  cursor:not-allowed;
}
.buttons{text-align:center}
#status{
  text-align:center;
  margin:20px 0;
  color:#287b50;
  font-weight:bold;
  overflow-wrap:anywhere;
  line-height:1.5;
}
.preview{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}
.preview-box{
  min-width:0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  text-align:center;
}
.preview-box img{
  display:block;
  width:100%;
  max-height:350px;
  object-fit:contain;
  background-color:#eee;
  background-image:
    linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
@media(max-width:600px){
  .preview{grid-template-columns:1fr}
  .container{padding:18px}
}
</style>
</head>

<body>

<div class="container">

<h1>Free AI Background Remover</h1>

<p class="intro">
Remove image backgrounds with AI and download transparent PNG images.
</p>

<div class="upload-area">
  <strong>Select Your Image</strong>
  <br><br>
  <input type="file" id="fileInput" accept="image/*">
  <button type="button" id="chooseBtn">Choose Image</button>
  <p id="fileName">No image selected</p>
</div>

<div class="buttons">
  <button type="button" id="removeBtn" disabled>
    Remove Background
  </button>

  <button type="button" id="downloadBtn" disabled>
    Download PNG
  </button>
</div>

<div id="status">
Please select an image to get started.
</div>

<div class="preview">

  <div class="preview-box">
    <h3>Original Image</h3>
    <img id="originalPreview" alt="Original image preview">
  </div>

  <div class="preview-box">
    <h3>Background Removed</h3>
    <img id="resultPreview" alt="Background removed preview">
  </div>

</div>
</div>

<script type="module">

const fileInput = document.getElementById("fileInput");
const chooseBtn = document.getElementById("chooseBtn");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusText = document.getElementById("status");
const fileName = document.getElementById("fileName");

const originalPreview = document.getElementById("originalPreview");
const resultPreview = document.getElementById("resultPreview");

let selectedFile = null;
let originalURL = null;
let resultURL = null;
let remover = null;
let processing = false;

chooseBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {

  const file = fileInput.files?.[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "Please select a valid image.";
    return;
  }

  selectedFile = file;

  if (originalURL) URL.revokeObjectURL(originalURL);
  if (resultURL) URL.revokeObjectURL(resultURL);

  originalURL = URL.createObjectURL(file);
  resultURL = null;

  originalPreview.src = originalURL;
  resultPreview.removeAttribute("src");

  fileName.textContent = file.name;

  removeBtn.disabled = false;
  downloadBtn.disabled = true;

  statusText.textContent =
    "Image selected successfully. Click Remove Background.";

});

async function prepareImage(file) {

  const image = new Image();
  const url = URL.createObjectURL(file);

  try {

    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(
        new Error("Could not open this image.")
      );
      image.src = url;
    });

    const maxSize = 1400;

    let width = image.naturalWidth;
    let height = image.naturalHeight;

    const scale = Math.min(
      1,
      maxSize / Math.max(width, height)
    );

    width = Math.round(width * scale);
    height = Math.round(height * scale);

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const context = canvas.getContext("2d");

    if (!context) {
      throw new Error("Could not prepare the image.");
    }

    context.drawImage(image, 0, 0, width, height);

    return canvas;

  } finally {
    URL.revokeObjectURL(url);
  }
}

removeBtn.addEventListener("click", async () => {

  if (!selectedFile || processing) return;

  processing = true;

  removeBtn.disabled = true;
  chooseBtn.disabled = true;
  downloadBtn.disabled = true;

  try {

    statusText.textContent =
      "Preparing your image...";

    const canvas = await prepareImage(selectedFile);

    statusText.textContent =
      "Loading AI model. First use may take a few minutes...";

    if (!remover) {

      const { pipeline } = await import(
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"
      );

      remover = await pipeline(
        "background-removal",
        "Xenova/modnet",
        { dtype: "fp32" }
      );
    }

    statusText.textContent =
      "AI is removing the background. Please wait...";

    const output = await remover(canvas);

    if (!output || !output[0]) {
      throw new Error("AI did not return an image.");
    }

    const resultBlob = await output[0].toBlob();

    if (!resultBlob || resultBlob.size === 0) {
      throw new Error("Could not create the transparent PNG.");
    }

    if (resultURL) URL.revokeObjectURL(resultURL);

    resultURL = URL.createObjectURL(resultBlob);

    resultPreview.src = resultURL;

    downloadBtn.disabled = false;

    statusText.textContent =
      "Background removed successfully! You can download your PNG.";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Error: " + (error.message || "Background removal failed.");

  } finally {

    processing = false;
    removeBtn.disabled = !selectedFile;
    chooseBtn.disabled = false;

  }

});

downloadBtn.addEventListener("click", () => {

  if (!resultURL) return;

  const link = document.createElement("a");

  link.href = resultURL;
  link.download = "background-removed.png";

  document.body.appendChild(link);
  link.click();
  link.remove();

});

</script>

</body>
</html>
