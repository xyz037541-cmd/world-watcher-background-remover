
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Background Remover | World Watcher</title>
<meta name="description" content="Remove image backgrounds free with this browser-based AI background remover. Download transparent PNG images.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:25px 15px;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
}
.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 18px rgba(0,0,0,.08);
}
h1{text-align:center;color:#23734d;font-size:27px}
.intro{text-align:center;color:#666;line-height:1.6}
.upload{
  display:block;
  margin:25px auto;
  padding:18px;
  width:100%;
  border:2px dashed #70a88b;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  background:#f8fcf9;
}
input[type=file]{max-width:100%}
button{
  border:0;
  padding:13px 22px;
  border-radius:7px;
  background:#287b50;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin:6px;
}
button:disabled{opacity:.5;cursor:not-allowed}
.buttons{text-align:center}
#status{text-align:center;margin:18px 0;color:#287b50;font-weight:bold}
.preview{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}
.preview-box{
  min-width:0;
  text-align:center;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
}
.preview-box img{
  width:100%;
  max-height:350px;
  object-fit:contain;
  background-color:#eee;
  background-image:
    linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
  background-size:20px 20px;
  background-position:0 0,0 10px,10px -10px,-10px 0;
}
@media(max-width:600px){
  .preview{grid-template-columns:1fr}
  .container{padding:18px}
}
</style>
</head>

<body>
<div class="container">
  <h1>Free AI Background Remover</h1>
  <p class="intro">Remove image backgrounds online for free. Upload your photo and download a transparent PNG.</p>

  <label class="upload">
    <strong>Select Your Image</strong><br><br>
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <div class="buttons">
    <button id="removeBtn" disabled>Remove Background</button>
    <button id="downloadBtn" disabled>Download PNG</button>
  </div>

  <div id="status">Please select an image to begin.</div>

  <div class="preview">
    <div class="preview-box">
      <h3>Original Image</h3>
      <img id="originalPreview" alt="Original image preview">
    </div>
    <div class="preview-box">
      <h3>Background Removed</h3>
      <img id="resultPreview" alt="Background removed image preview">
    </div>
  </div>
</div>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";

const fileInput = document.getElementById("fileInput");
const removeBtn = document.getElementById("removeBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusText = document.getElementById("status");
const originalPreview = document.getElementById("originalPreview");
const resultPreview = document.getElementById("resultPreview");

let originalFile = null;
let resultUrl = null;
let remover = null;

fileInput.addEventListener("change", () => {
  const file = fileInput.files?.[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "Please select a valid image.";
    return;
  }

  originalFile = file;
  originalPreview.src = URL.createObjectURL(file);
  resultPreview.removeAttribute("src");

  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = null;

  removeBtn.disabled = false;
  downloadBtn.disabled = true;
  statusText.textContent = "Image uploaded. Click Remove Background.";
});

removeBtn.addEventListener("click", async () => {
  if (!originalFile) return;

  removeBtn.disabled = true;
  downloadBtn.disabled = true;

  try {
    statusText.textContent = "Loading AI model. First use may take a few minutes...";

    if (!remover) {
      remover = await pipeline(
        "background-removal",
        "Xenova/modnet",
        { quantized: true }
      );
    }

    statusText.textContent = "Removing background. Please wait...";

    const imageUrl = URL.createObjectURL(originalFile);

    try {
      const output = await remover(imageUrl);

      if (!output || !output[0] || !output[0].url) {
        throw new Error("AI did not return a valid transparent image.");
      }

      const response = await fetch(output[0].url);
      if (!response.ok) throw new Error("Could not create the result image.");

      const blob = await response.blob();

      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(blob);

      resultPreview.src = resultUrl;
      downloadBtn.disabled = false;
      statusText.textContent = "Background removed successfully!";
    } finally {
      URL.revokeObjectURL(imageUrl);
    }

  } catch (error) {
    console.error(error);
    statusText.textContent = "Sorry, background removal failed. Please try a smaller image.";
  } finally {
    removeBtn.disabled = false;
  }
});

downloadBtn.addEventListener("click", () => {
  if (!resultUrl) return;

  const link = document.createElement("a");
  link.href = resultUrl;
  link.download = "background-removed.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
});
</script>
</body>
</html>
